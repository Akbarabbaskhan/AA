name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://volt:volt@localhost:5432/volt_test?schema=public
  REDIS_URL: redis://localhost:6379
  NEXTAUTH_SECRET: ci-secret-not-used-outside-ci
  NEXTAUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  DEFAULT_TENANT_SLUG: volt-demo

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt
          POSTGRES_DB: volt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volt -d volt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Integration tests run against the full seed, not twenty rows — the N+1 queries that
      # sink this product only appear at volume.
      - name: Seed
        run: npm run db:seed

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (mobile viewport)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt
          POSTGRES_DB: volt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volt -d volt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # "Run on mobile viewport in CI" — the demo happens on a phone, so the tests do too.
      - name: Run E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
